appId: com.undercut.app
tags:
  - simple
  - league
---
# LEAGUE tab without a league shows "Racing solo." and the Create / Join cards.
- runFlow: simple-create-team.yaml
- tapOn: "LEAGUE"
- extendedWaitUntil:
    visible: "RACING"
    timeout: 5000
- assertVisible: "CREATE A LEAGUE"
- assertVisible: "JOIN A LEAGUE"
- tapOn: "JOIN A LEAGUE"
- extendedWaitUntil:
    visible: "ENTER CODE"
    timeout: 5000
- tapOn: "← BACK"
