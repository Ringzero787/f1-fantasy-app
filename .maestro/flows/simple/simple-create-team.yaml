appId: com.undercut.app
tags:
  - simple
  - team
---
# First run: name the team, land on the Team grid with six open slots.
- runFlow: setup-simple-demo.yaml
- tapOn: "TEAM NAME"
- inputText: "Test Grid Team"
- hideKeyboard
- tapOn: "CREATE TEAM"
- extendedWaitUntil:
    visible: "TEST GRID TEAM"
    timeout: 8000
- assertVisible: "SEASON PTS"
- assertVisible: "LINEUP · 6 OPEN"
- assertVisible: "ADD CONSTRUCTOR"
- assertVisible: "EDIT →"
