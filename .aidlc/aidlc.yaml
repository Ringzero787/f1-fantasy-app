name: f1-fantasy-app
description: Two Expo apps in one repo — Undercut (F1 fantasy, repo root,
  com.undercut.app) and Track Limits (newgame/, com.tracklimits.app) — each with
  Firebase Cloud Functions.
public: true
profiles:
  - mobile-react-native
aidlc:
  repo: Ringzero787/aidlc
  ref: main
standalone:
  setup: |
    (cd newgame && npm ci)
    (cd newgame/functions && npm ci --ignore-scripts)
    (cd functions && npm ci --ignore-scripts) || true
  release_setup: |
    (cd newgame && npm ci)
    (cd newgame/functions && npm ci --ignore-scripts)
adopted_at: 2026-09-11
baseline_sha: 3a63cf1eeec2dcfd28059fb0c58bf7b949f40ddb
budgets:
  pr_tokens: 150000
  release_tokens: 500000
  lookback_tokens: 200000
overrides:
  hygiene:
    lint: npm run lint
    typecheck: npx tsc --noEmit && (cd newgame && npx tsc --noEmit) && (cd
      newgame/functions && npx tsc --noEmit -p .)
    test: npm test -- --ci
  build:
    command: npx expo export --platform android --output-dir
      .aidlc/tmp/export-undercut && (cd newgame && npx expo export --platform
      android --output-dir ../.aidlc/tmp/export-tracklimits)
    output: .aidlc/tmp/export-tracklimits
    targets:
      android:
        command: cd newgame && npx eas build --platform android --profile production
          --non-interactive --no-wait
        artifact: ""
        runner: ubuntu-latest
        tiers:
          - release
      ios:
        command: cd newgame && npx eas build --platform ios --profile production
          --non-interactive --no-wait
        artifact: ""
        runner: ubuntu-latest
        tiers:
          - release
    manifests:
      android: newgame/app.config.js
      ios: newgame/app.config.js
  security:
    semgrep_config:
      - p/default
      - p/owasp-top-ten
      - p/secrets
      - p/typescript
      - p/react
      - p/nodejs
  privacy:
    ios_privacy_manifest: ""
    android_data_safety: .aidlc/data-safety.yaml
  release:
    stores:
      - google_play
      - apple
      - amazon
gates:
  G09:
    blocking: warn
trademark:
  watchlist:
    - Formula 1
    - Formula One
    - F1
    - FIA
    - Grand Prix
  nice_classes:
    - 9
    - 41
    - 42
stores:
  google_play: true
  apple: true
  amazon: true
