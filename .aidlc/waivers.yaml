waivers:
  # F-148 (2026-11-14): the blanket "GHSA-" waiver (2026-09-18, ~200 advisories) is retired. The
  # dependency pass took the repo from 175 osv findings to 44 with no HIGH left in a runtime package;
  # the three below need a major upgrade their only consumer cannot take yet. Each is pinned to
  # the vulnerable version, so any bump resurfaces it, and expires before the 2027 season.
  - gate: G05
    finding: "image-size@1.2.1:"
    reason: DoS via an infinite loop parsing a crafted JXL, HEIF or ICNS file. Its only
      consumer is metro, at build time, reading this repo's own image assets; nothing
      user-supplied reaches it and it is not in the app bundle. The fix is image-size
      2.x, which drops the file-path API metro calls. Goes with the Expo SDK upgrade.
    by: nathan
    date: 2026-11-14
    expires: 2027-03-01
  - gate: G05
    finding: "zod@3.25.76: GHSA-mrhx-c7xc-m3w5"
    reason: Memory exhaustion validating an oversized constrained collection. Only
      @expo/cli uses this copy, on the developer box and the build box, to validate this
      repo's own config. The fix is zod 4, a major the Expo CLI does not support. Goes
      with the Expo SDK upgrade.
    by: nathan
    date: 2026-11-14
    expires: 2027-03-01
  - gate: G05
    finding: "decode-uri-component@0.2.2: GHSA-qr28-fpjm-wq7f"
    reason: Exponential decoding of a malformed percent-encoded string. expo-router's
      query-string parses deep-link URLs with it in the app, so a crafted link can hang
      the app of the user who opens it; no server or other user is affected. The fix
      (0.5.x) is ESM-only and query-string 7 loads it with require, so it needs
      expo-router's next major. Goes with the Expo SDK upgrade.
    by: nathan
    date: 2026-11-14
    expires: 2027-03-01
  - gate: G14
    finding: Destructive operation OP-033
    reason: 1st to 2nd Gen migration of the same two function names, which firebase
      refuses in place. pw-createPortalHandoff and pw-redeemPortalHandoff hold
      no data and are already non-functional in production (the gen-1 runtime
      service account cannot createCustomToken, so redeem returns INTERNAL).
      OP-034 is dry-run clean and recreates both at gen-2 immediately after.
      Owner approved on 2026-09-24.
    by: nathan
    date: 2026-09-24
  - gate: G06
    finding: Hydration-gated language apply
    reason: "False positive: LaunchReveal holds the native splash via
      preventAutoHideAsync() until its overlay paints, then animates over the
      app, so content is covered for far longer than an AsyncStorage read.
      Evidence now cited in bootstrap.ts and the F-079 spec, with the fallback
      to record if that choreography is ever removed."
    by: nathan
    date: 2026-09-25
  - gate: G16
    finding: Plural form missing ICU syntax
    reason: "False positive: i18next parses suffix plural keys
      (races_one/races_other) with compatibilityJSON v4; ICU message syntax
      needs the separate i18next-icu plugin and would break these catalogs. The
      gate prompt has been corrected upstream (G16@2) so it no longer recommends
      converting between plural styles."
    by: nathan
    date: 2026-09-25
  - gate: G07
    finding: Watchlist mark "Grand Prix" appears in new name
    reason: 'False positive on TEST FIXTURES, not product naming. The two
      flagged strings are the only matches in the diff and both come from unit
      test objects in newgame/functions/scripts/fixRaceSchedules.test.js
      ("name: ''Bahrain Grand Prix''" at L75/76, "name: ''Singapore Grand Prix''"
      at L101) — never shipped, never user-visible. The real race data (minified
      seed JSON) does not even match the scanner regex, since "name":"..." has a
      quote between name and the colon. Root cause: scanners.ts newNames has no
      path scoping, unlike permissionDiff directly above it, which excludes
      tests by design. Filed upstream as aidlc#9. Naming real F1 events in race
      data is also permitted by this repo''s own trademark policy ("fine as
      descriptive text; never in an app, feature, pack or league name"). The
      accompanying low finding is the gate reporting it has no USPTO/EUIPO
      credentials — "a gap, not a clearance" in its own words — and stays live
      as a warn.'
    by: nathan
    date: 2026-10-01
