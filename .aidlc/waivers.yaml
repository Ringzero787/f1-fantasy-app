waivers:
  - gate: G05
    finding: GHSA-
    reason: Pre-existing dependency advisories (F-027 dependency bump pass) in the
      functions lockfile, which this PR does not change; CI reports absolute
      paths so the waiver is by title. Expires so the bump is revisited.
    by: nathan
    date: 2026-09-18
    expires: 2026-10-31
  - gate: G14
    finding: Destructive operation OP-033
    reason: 1st to 2nd Gen migration of the same two function names, which firebase
      refuses in place. pw-createPortalHandoff and pw-redeemPortalHandoff hold
      no data and are already non-functional in production (the gen-1 runtime
      service account cannot createCustomToken, so redeem returns INTERNAL).
      OP-034 is dry-run clean and recreates both at gen-2 immediately after.
      Owner approved on 2026-09-24.
    by: nathan
    date: 2026-09-24
  - gate: G06
    finding: Hydration-gated language apply
    reason: "False positive: LaunchReveal holds the native splash via
      preventAutoHideAsync() until its overlay paints, then animates over the
      app, so content is covered for far longer than an AsyncStorage read.
      Evidence now cited in bootstrap.ts and the F-079 spec, with the fallback
      to record if that choreography is ever removed."
    by: nathan
    date: 2026-09-25
  - gate: G16
    finding: Plural form missing ICU syntax
    reason: "False positive: i18next parses suffix plural keys
      (races_one/races_other) with compatibilityJSON v4; ICU message syntax
      needs the separate i18next-icu plugin and would break these catalogs. The
      gate prompt has been corrected upstream (G16@2) so it no longer recommends
      converting between plural styles."
    by: nathan
    date: 2026-09-25
