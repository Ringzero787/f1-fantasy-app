name: aidlc-lookback
on:
  schedule: [{ cron: "0 6 1 * *" }]   # monthly
  workflow_dispatch:
jobs:
  lookback:
    permissions: { contents: write, pull-requests: write, actions: read }
    uses: Ringzero787/aidlc/.github/workflows/aidlc-lookback.yml@main
    with: { aidlc_ref: main }
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      AIDLC_DEPLOY_KEY: ${{ secrets.AIDLC_DEPLOY_KEY }}
