<title>Undercut Pit Wall</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;700;900&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
:root{
  --bg:#050505;--surface:#0E0E0E;--card:#1A1A1A;--press:#232323;--border:#232323;--borderL:#1E1E1E;--borderS:#333333;
  --fg:#F2F2F2;--fg2:#B3B3B3;--muted:#7A7A7A;--inv:#050505;--red:#FF2E2E;--redFaint:#2A0F0F;--pos:#4ADE80;--warn:#FFB800;
  --disp:'Unbounded',system-ui,sans-serif;--mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
  --bg:#FFFFFF;--surface:#F4F4F2;--card:#E8E8E5;--press:#DDDDD9;--border:#D6D6D2;--borderL:#DDDDD9;--borderS:#C8C8C4;
  --fg:#0A0A0A;--fg2:#3D3D3D;--muted:#6B6B6B;--inv:#FFFFFF;--redFaint:#FFE3E3;--pos:#15803D;--warn:#9A6B00;}}
:root[data-theme="light"]{
  --bg:#FFFFFF;--surface:#F4F4F2;--card:#E8E8E5;--press:#DDDDD9;--border:#D6D6D2;--borderL:#DDDDD9;--borderS:#C8C8C4;
  --fg:#0A0A0A;--fg2:#3D3D3D;--muted:#6B6B6B;--inv:#FFFFFF;--redFaint:#FFE3E3;--pos:#15803D;--warn:#9A6B00;}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--mono);font-weight:500;font-size:12px;line-height:1.45}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--red);outline-offset:2px}
.wrap{max-width:1360px;margin:0 auto;padding-inline:24px;padding-block:0 28px;background:var(--surface);min-height:100vh;border-inline:1px solid var(--border)}
@media(max-width:640px){.wrap{padding-inline:16px}}
.lbl{font:700 11px var(--mono);letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.red{color:var(--red)}.pos{color:var(--pos)}.mut{color:var(--muted)}.num{font-variant-numeric:tabular-nums}
/* context bar */
.ctx{position:sticky;top:0;z-index:20;background:var(--surface);padding-block:14px 12px;border-bottom:1px solid var(--border);display:flex;flex-direction:column;gap:12px}
.ctxrow{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:center;justify-content:space-between;font:700 11px var(--mono);letter-spacing:.12em;text-transform:uppercase}
.ctxrow .grp{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:center}
.brand{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.brand h1{font:900 26px var(--disp);letter-spacing:-.03em;text-transform:uppercase;margin:0}
.pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--borderS);border-radius:999px;padding:3px 9px;font:700 9px var(--mono);letter-spacing:.14em;text-transform:uppercase;white-space:nowrap}
.pill.r{border-color:var(--red);color:var(--red)}
.tabs{display:flex;background:var(--card);border-radius:999px;padding:4px;gap:2px;overflow-x:auto;scrollbar-width:none}
.tabs button{flex:1 0 auto;padding:9px 14px;border-radius:999px;font:900 11px var(--disp);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.tabs button[aria-selected="true"]{background:var(--fg);color:var(--inv)}
.tabs.sm{display:inline-flex}.tabs.sm button{padding:6px 11px;font-size:9px;flex:0 0 auto}
/* layout */
.page{display:grid;grid-template-columns:repeat(12,1fr);gap:10px;padding-top:16px;align-items:start}
.c4{grid-column:span 4}.c5{grid-column:span 5}.c6{grid-column:span 6}.c7{grid-column:span 7}.c8{grid-column:span 8}.c12{grid-column:span 12}
@media(max-width:980px){.c4,.c5,.c6,.c7,.c8{grid-column:span 12}}
.tile{background:var(--card);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.tile.open{background:transparent;border:1px solid var(--border)}
.tile.you{background:var(--bg);border:1px solid var(--red)}
.th{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.big{font:900 44px/0.9 var(--disp);letter-spacing:-.05em}
.h2{font:900 16px var(--disp);text-transform:uppercase;letter-spacing:-.01em}
.row{display:grid;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--borderL);min-height:44px}
.row:first-of-type{border-top:0}
.click{cursor:pointer;border-radius:10px}.click:hover{background:var(--press)}
.tbar{display:inline-block;width:20px;height:3px;border-radius:2px;vertical-align:middle;margin-right:6px}
.name{font:900 13px var(--disp);text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th{font:700 10px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);text-align:right;padding:6px 8px;white-space:nowrap;position:sticky;top:0}
th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:var(--card)}
td{padding:7px 8px;text-align:right;border-top:1px solid var(--borderL);white-space:nowrap}
tr.click:hover td{background:var(--press)}tr.me td:first-child{box-shadow:inset 2px 0 0 var(--red)}
.range{position:relative;height:10px;width:130px;display:inline-block;vertical-align:middle}
.range i{position:absolute;top:3px;height:4px;border-radius:2px;background:var(--borderS)}
.range b{position:absolute;top:0;width:2px;height:10px;background:var(--fg)}
.cell{display:inline-grid;place-items:center;min-width:34px;height:26px;border-radius:6px;font:700 10px var(--mono)}
.chip{border:1px solid var(--borderS);border-radius:12px;padding:6px 10px;font:700 10px var(--mono);letter-spacing:.1em;text-transform:uppercase}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--inv);border-color:var(--fg)}
.cta{background:var(--red);color:#fff;border-radius:999px;padding:12px 18px;font:900 11px var(--disp);letter-spacing:.08em;text-transform:uppercase}
.cta[disabled]{background:var(--card);color:var(--muted);cursor:default;border:1px solid var(--borderS)}
.ghost{border:1px solid var(--borderS);border-radius:999px;padding:7px 12px;font:700 10px var(--mono);letter-spacing:.1em;text-transform:uppercase}
.meter{height:4px;border-radius:2px;background:var(--borderS);position:relative;overflow:hidden}
.meter i{position:absolute;inset:0 auto 0 0;background:var(--fg);border-radius:2px}
.meter.r i{background:var(--red)}
svg text{font:500 10px var(--mono);fill:var(--muted)}
.est{border:1px dashed var(--borderS);border-radius:14px;padding:12px;color:var(--fg2);font-size:12px;line-height:1.6}
/* driver tile (lineup) */
.lineup{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media(max-width:560px){.lineup{grid-template-columns:repeat(2,1fr)}}
.dt{background:var(--card);border-radius:18px;padding:14px;min-height:124px;display:flex;flex-direction:column;justify-content:space-between;text-align:left;border:1px solid transparent}
.dt.ctor{background:var(--bg);border-color:var(--red)}
.dt[aria-pressed="true"]{border-color:var(--fg)}
.dt .nm{font:900 17px var(--disp);text-transform:uppercase;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* slide-over */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:40}
.over{position:fixed;top:0;right:0;bottom:0;width:min(480px,100%);background:var(--surface);border-left:1px solid var(--border);z-index:41;overflow-y:auto;padding:20px 24px 28px;display:flex;flex-direction:column;gap:14px;transition:transform .2s ease}
@media(prefers-reduced-motion:reduce){.over{transition:none}}
#tip{position:fixed;z-index:60;pointer-events:none;background:var(--fg);color:var(--inv);border-radius:8px;padding:6px 9px;font:700 10px var(--mono);max-width:240px;white-space:pre-line}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--fg);color:var(--inv);border-radius:999px;padding:10px 18px;font:700 11px var(--mono);letter-spacing:.08em;z-index:70}
.foot{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-top:18px;padding-top:12px;border-top:1px solid var(--border);color:var(--muted);font-size:10px;letter-spacing:.08em;text-transform:uppercase}
.recgrid{display:grid;grid-template-columns:5fr 7fr;gap:16px}
@media(max-width:980px){.recgrid{grid-template-columns:1fr}}
.row.sel{background:var(--press);box-shadow:inset 2px 0 0 var(--red)}
.row.pad{padding-inline:10px}
.cmp{border:1px solid var(--border);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:6px;min-width:0}
.cmph,.cmpr{display:grid;grid-template-columns:1fr 120px 1fr;gap:10px;align-items:center}
.cmpr{padding:7px 0;border-top:1px solid var(--borderL)}
.cmpr>:nth-child(2),.cmph>:nth-child(2){text-align:center}.cmpr>:last-child,.cmph>:last-child{text-align:right}
.cmph .pill{justify-self:center}.row .pill{justify-self:start}
.cmpr b.win{color:var(--fg)}.cmpr .lose{color:var(--muted)}
.bars{display:flex;align-items:flex-end;gap:3px;height:70px;position:relative}
.bars span{flex:1;border-radius:3px 3px 0 0;background:var(--borderS);min-height:2px}
.bars span.hit{background:var(--fg)}
.bars u{position:absolute;left:0;right:0;border-top:1px dashed var(--red)}
.split{display:grid;grid-template-columns:34px 1fr 34px;gap:8px;align-items:center}
.split .sb{display:flex;height:6px;gap:2px}.split .sb i{background:var(--fg);border-radius:3px}.split .sb em{background:var(--borderS);border-radius:3px}
</style>

<div class="wrap">
  <header class="ctx">
    <div class="ctxrow">
      <div class="brand"><h1>Pit Wall</h1><span class="lbl">Undercut · analytics</span><span class="pill r">Prototype · example data</span></div>
      <div class="grp"><span class="mut">Data as of 19 Sep 06:00 UTC</span><button class="ghost" id="themeBtn" type="button">Light / dark</button></div>
    </div>
    <div class="ctxrow">
      <div class="grp"><span>RD 17 · Baku</span><span class="mut">FP1 Fri 25 Sep</span><span class="red">Locks in 6d 04h</span></div>
      <div class="grp"><span class="mut">Team</span><span>Late Brakers</span><span class="mut">Bank</span><span class="num" id="ctxBank"></span><span class="mut">Proj</span><span class="num" id="ctxProj"></span></div>
    </div>
    <nav class="tabs" id="nav" role="tablist" aria-label="Pit Wall pages"></nav>
  </header>
  <main id="main"></main>
  <footer class="foot"><span id="scrollBudget"></span><span>Unofficial. Not affiliated with any racing series, team or governing body. Model estimates, not odds.</span></footer>
</div>
<div id="layer"></div><div id="tip" hidden></div><div id="toast" hidden></div>

<script>
/* ---------- example data (deterministic) ---------- */
let seed=17;const rnd=()=>{seed=(seed*16807)%2147483647;return (seed-1)/2147483646};
const TEAMS={MCL:['McLaren','#FF8000'],RBR:['Red Bull','#3671C6'],FER:['Ferrari','#E80020'],MER:['Mercedes','#27F4D2'],WIL:['Williams','#64C4FF'],AMR:['Aston Martin','#229971'],ALP:['Alpine','#0093CC'],RCB:['Racing Bulls','#6692FF'],HAA:['Haas','#B6BABD'],AUD:['Audi','#52E252'],CAD:['Cadillac','#C7B063']};
const RAW=[['VER',1,'Verstappen','RBR',591,58],['NOR',4,'Norris','MCL',560,55],['PIA',81,'Piastri','MCL',548,52],['RUS',63,'Russell','MER',520,47],['LEC',16,'Leclerc','FER',498,44],['ANT',12,'Antonelli','MER',480,40],['HAM',44,'Hamilton','FER',477,38],['HAD',6,'Hadjar','RBR',96,34],['SAI',55,'Sainz','WIL',310,30],['ALB',23,'Albon','WIL',298,28],['ALO',14,'Alonso','AMR',240,24],['BEA',87,'Bearman','HAA',188,21],['LAW',30,'Lawson','RCB',212,20],['HUL',27,'Hulkenberg','AUD',176,19],['GAS',10,'Gasly','ALP',205,18],['OCO',31,'Ocon','HAA',204,17],['BOR',5,'Bortoleto','AUD',150,16],['LIN',41,'Lindblad','RCB',120,14],['STR',18,'Stroll','AMR',110,11],['PER',11,'Perez','CAD',105,10],['COL',43,'Colapinto','ALP',95,9],['BOT',77,'Bottas','CAD',98,9]];
const D=RAW.map(([id,num,name,team,price,med])=>{const sd=6+med*.28;const form=Array.from({length:16},()=>Math.max(0,Math.round(med+(rnd()-.5)*sd*2.6)*(rnd()<.08?0:1)));
  return {id,num,name,team,price,med,floor:Math.max(0,Math.round(med-sd)),ceil:Math.round(med+sd*1.15),form,dnf:Math.round(4+rnd()*14),own:Math.round(rnd()*70+(med>40?20:0)),
    pm:+((med-price/11)).toFixed(1),cons:Math.round(40+rnd()*40),dprice:Math.round((med-price/11)*1.4),fit:Array.from({length:6},()=>1+Math.floor(rnd()*5)),
    win:Math.max(0,Math.round((med-30)*1.1+(rnd()*4))),q:+(rnd()*1.2).toFixed(2),r:+(rnd()*1.2).toFixed(2)}});
D.forEach(d=>{d.val=+(d.med/d.price*100).toFixed(1);d.pod=Math.min(88,d.win*2+Math.round(rnd()*8));d.t10=Math.min(97,Math.round(d.med*1.7+10))});
const C=[['MCL',620,96],['MER',540,80],['FER',510,74],['RBR',500,78],['WIL',330,52],['HAA',240,34],['RCB',230,30],['AMR',210,28],['AUD',200,30],['ALP',180,22],['CAD',160,16]].map(([id,price,med])=>({id,name:TEAMS[id][0],team:id,price,med,ctor:true,floor:Math.round(med*.7),ceil:Math.round(med*1.3),val:+(med/price*100).toFixed(1)}));
const byId=id=>D.find(d=>d.id===id)||C.find(c=>c.id===id);
const ROUNDS=['BAK','SIN','AUS','MEX','SAO','LVG'];const BUDGET=2250;
const state={page:'BRIEFING',boardTab:'PROJECTIONS',preset:'VALUE',sort:'med',paceTab:'LONG RUN',mktTab:'PRICE MODEL',lineup:['NOR','LEC','SAI','HAD','BEA'],ctor:'MER',ace:'NOR',saved:null,slot:null,over:null,overTab:'PRESENT',thr:25,win:'L10',wire:'ALL',rec:0};
state.saved=JSON.stringify([state.lineup,state.ctor,state.ace]);
const NEWS=[['PENALTY','HAM','−','Ferrari confirms a new energy store for Hamilton: 10-place grid drop in Baku.','2 sources','Governing-body doc 14 · team release'],['UPGRADE','MCL','+','McLaren brings a low-drag rear wing; long straights suit it.','3 sources','Team release · 2 outlets'],['WEATHER','ALL','•','Race-day rain chance up from 10% to 35%. Wet delta favours Verstappen, Alonso.','model','Forecast feed'],['RELIABILITY','ALO','−','Aston Martin investigating a gearbox issue from Madrid; no penalty yet.','2 sources','2 outlets · unconfirmed'],['CONTRACT','COL','•','Alpine seat for 2027 still open; no change to this weekend.','4 sources','4 outlets']];
const RIVALS=[['Apex Hunters',1,33,['VER','RUS','HAD','ALB','LAW'],120,.85],['Box Box Baby',3,-21,['NOR','LEC','HAD','HUL','COL'],60,.7],['Marbles FC',4,-64,['VER','LEC','GAS','OCO','BOT'],90,.3],['Lift and Coast',5,-102,['PIA','HAM','ALO','BEA','LIN'],150,.1]];
const rivalMove=([name,rank,gap,lu,bank,act])=>{let best=null;lu.forEach(o=>{const od=byId(o);D.forEach(n=>{if(lu.includes(n.id)||n.price-od.price>bank)return;const g=n.med-od.med;if(!best||g>best.g)best={o:od,n,g}})});return {name,rank,gap,bank,act,...best,like:Math.round(act*Math.min(1,best.g/8)*100)}};
const PAGES=['BRIEFING','BOARD','CIRCUIT','PACE LAB','MARKET','LINEUP LAB','SEASON','WIRE'];
/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);const esc=s=>String(s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const bar=t=>`<span class="tbar" style="background:${TEAMS[t][1]}"></span>`;
const money=n=>'$'+n.toLocaleString('en-US');
const arrow=n=>n>0?`<span class="pos">▲ ${n}</span>`:n<0?`<span class="red">▼ ${-n}</span>`:`<span class="mut">• 0</span>`;
const range=d=>{const mx=80;return `<span class="range" data-tip="Floor ${d.floor} · median ${d.med} · ceiling ${d.ceil}\n15th to 85th percentile of 10,000 sims"><i style="left:${d.floor/mx*100}%;width:${(d.ceil-d.floor)/mx*100}%"></i><b style="left:${d.med/mx*100}%"></b></span>`};
const spark=(a,w=84,h=22)=>{const mx=Math.max(...a,1),p=a.map((v,i)=>[i/(a.length-1)*(w-6)+3,h-3-v/mx*(h-6)]);return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true"><polyline points="${p.map(x=>x.join(',')).join(' ')}" fill="none" stroke="var(--muted)" stroke-width="1.5"/><circle cx="${p.at(-1)[0]}" cy="${p.at(-1)[1]}" r="2.5" fill="var(--fg)"/></svg>`};
const fitCell=(v,l)=>`<span class="cell" style="background:color-mix(in srgb,var(--fg) ${v*17}%,transparent);color:${v>=4?'var(--inv)':'var(--fg)'}" data-tip="${l}: circuit fit ${v}/5">${v}</span>`;
const tabs=(key,opts,sm=true)=>`<div class="tabs ${sm?'sm':''}" role="tablist">${opts.map(o=>`<button type="button" role="tab" data-set="${key}" data-v="${o}" aria-selected="${state[key]===o}">${o}</button>`).join('')}</div>`;
const tile=(cls,label,body,right='')=>`<section class="tile ${cls}"><div class="th"><span class="lbl">${label}</span>${right}</div>${body}</section>`;
const proj=()=>state.lineup.reduce((s,id)=>s+byId(id).med*(id===state.ace?2:1),0)+byId(state.ctor).med;
const spent=()=>state.lineup.reduce((s,id)=>s+byId(id).price,0)+byId(state.ctor).price;
const dirty=()=>JSON.stringify([state.lineup,state.ctor,state.ace])!==state.saved;
const recs=()=>{const out=[];state.lineup.forEach(o=>{const od=byId(o);D.filter(n=>!state.lineup.includes(n.id)&&n.price-od.price<=BUDGET-spent()).forEach(n=>{const g=(n.med-od.med)*(o===state.ace?2:1);if(g>2)out.push({o,n:n.id,g,cost:n.price-od.price})})});return out.sort((a,b)=>b.g-a.g).slice(0,3)};
const near=(d,f=()=>true)=>D.filter(x=>!state.lineup.includes(x.id)&&f(x)).sort((a,b)=>Math.abs(a.price-d.price)-Math.abs(b.price-d.price))[0];
const briefRecs=()=>{const out=[],L=state.lineup.map(byId),bank=BUDGET-spent();
 recs().forEach(x=>{const n=byId(x.n),o=byId(x.o);out.push({k:'SWAP',a:x.o,b:x.n,t:`${o.name} → ${n.name}`,tag:`+${x.g.toFixed(0)} PTS`,good:1,act:`${x.o}:${x.n}`,why:`${n.name} projects ${n.med-o.med} points higher for ${x.cost>=0?money(x.cost)+' more':money(-x.cost)+' less'}, inside your ${money(bank)} bank.`})});
 const best=[...L].sort((a,b)=>b.med-a.med),ace=byId(state.ace);
 if(best[0].id!==ace.id)out.push({k:'ACE',a:ace.id,b:best[0].id,t:`Move ace to ${best[0].name}`,tag:`+${best[0].med-ace.med} PTS`,good:1,ace:best[0].id,why:`The ace doubles points. ${best[0].name} has the highest projection in your lineup.`});
 else out.push({k:'ACE',a:ace.id,b:best[1].id,t:`Keep ace on ${ace.name}`,tag:'HOLD',why:`${ace.name} out-projects your next best driver by ${ace.med-best[1].med} points, doubled.`});
 const v=[...L].sort((a,b)=>b.val-a.val)[0],va=near(v);out.push({k:'HOLD',a:v.id,b:va.id,t:`Hold ${v.name}`,tag:'HOLD',why:`Best value in your lineup. The closest alternative at this price (${va.name}) returns ${va.val} points per $100 against ${v.val}.`});
 const r=[...L].sort((a,b)=>b.dnf-a.dnf)[0],ra=near(r,x=>x.dnf<r.dnf&&x.price-r.price<=bank)||near(r);out.push({k:'RISK',a:r.id,b:ra.id,t:`Watch ${r.name}`,tag:`${r.dnf}% DNF`,bad:1,act:`${r.id}:${ra.id}`,why:`Highest retirement risk in your lineup. ${ra.name} is the nearest-priced option with a safer floor.`});
 const c=byId(state.ctor),cb=C.filter(x=>x.id!==c.id&&x.price-c.price<=bank).sort((a,b)=>b.med-a.med)[0];
 if(cb&&cb.med>c.med)out.push({k:'TEAM',a:c.id,b:cb.id,t:`${c.name} → ${cb.name}`,tag:`+${cb.med-c.med} PTS`,good:1,act:`CTOR:${cb.id}`,why:`${cb.name} projects higher and fits your bank.`});
 else if(cb)out.push({k:'TEAM',a:c.id,b:cb.id,t:`Keep ${c.name}`,tag:'HOLD',why:`No affordable constructor projects above ${c.name} (${c.med}). Best alternative: ${cb.name} at ${cb.med}.`});
 return out};
const cmp=x=>{const a=byId(x.a),b=byId(x.b),M=[['Projection','med',1],['Floor','floor',1],['Ceiling','ceil',1],['Pts per $100','val',1],['Baku fit /5',d=>d.fit?.[0],1],['Next price',d=>d.dprice,1],['DNF risk %','dnf',-1],['League owned %','own',0],['Price','price',-1]];
 const get=(d,k)=>typeof k==='function'?k(d):d[k];const f=(k,v)=>v==null?'—':k==='price'?money(v):v;
 const head=d=>`<span><span class="name">${d.name}</span>${bar(d.team)}<span class="mut">${d.ctor?'TEAM':'#'+d.num}</span></span>`;

 ${tile('c8','Schedule difficulty · next 6 rounds',`<div class="scroll"><table><thead><tr><th>Driver</th>${ROUNDS.map((r,i)=>`<th>${r}${i===2||i===4?' ·S':''}</th>`).join('')}<th>Avg</th></tr></thead><tbody>${D.slice(0,12).map(d=>`<tr class="click ${state.lineup.includes(d.id)?'me':''}" data-open="${d.id}" tabindex="0"><td>${bar(d.team)}<b>${d.name}</b></td>${d.fit.map((v,i)=>`<td>${fitCell(v,ROUNDS[i])}</td>`).join('')}<td>${(d.fit.reduce((a,b)=>a+b)/6).toFixed(1)}</td></tr>`).join('')}</tbody></table></div><span class="mut">Circuit fit 1 to 5, brighter is better. ·S marks sprint weekends.</span>`)}
 ${tile('c4','Title simulation · 10,000 seasons',[['NOR',41],['VER',33],['PIA',19],['RUS',6],['LEC',1]].map(([id,p])=>`<div class="row click" style="grid-template-columns:90px 1fr 38px" data-open="${id}" tabindex="0"><span>${bar(byId(id).team)}${id}</span><span class="meter"><i style="width:${p*2}%"></i></span><span class="num">${p}%</span></div>`).join(''))}
 ${tile('c8','Power unit and penalty tracker',`<div class="scroll"><table><thead><tr><th>Driver</th><th>ICE</th><th>Turbo</th><th>MGU-K</th><th>Energy store</th><th>Control elec.</th><th>Status</th></tr></thead><tbody>${['HAM','ALO','VER','SAI','OCO','GAS'].map((id,i)=>{const d=byId(id),u=[4,4,4,3,3].map((a,j)=>Math.min(a+1,a-((i+j)%3)+1));const hot=u.some((v,j)=>v>[4,4,4,3,3][j]);return `<tr class="click" data-open="${id}" tabindex="0"><td>${bar(d.team)}<b>${d.name}</b></td>${u.map((v,j)=>`<td><span class="cell" style="border:1px solid ${v>=[4,4,4,3,3][j]?'var(--red)':'var(--borderS)'}">${v}/${[4,4,4,3,3][j]}</span></td>`).join('')}<td>${hot?'<span class="red">⚠ PENALTY TAKEN</span>':i<3?'<span style="color:var(--warn)">▲ AT LIMIT</span>':'<span class="mut">OK</span>'}</td></tr>`}).join('')}</tbody></table></div>`)}
 ${tile('c4','Your team value',`<div class="big num">${money(spent())}</div>${spark([1500,1540,1610,1650,1640,1720,1790,1850,1900,1980,2040,2100,2130,2160,2180,spent()],300,60)}<span class="mut">+46% since round 1 · league rank 2 of 10</span>`)}`;
P['WIRE']=()=>{const cats=['ALL',...new Set(NEWS.map(n=>n[0]))];const list=NEWS.filter(n=>state.wire==='ALL'||n[0]===state.wire);
 return tile('c12','The wire · story clusters',list.map(n=>`<div class="row click" style="grid-template-columns:100px 1fr auto" data-open="${n[1]==='ALL'?'':n[1]}" tabindex="0"><span class="pill ${n[2]==='−'?'r':''}">${n[0]}</span><span>${esc(n[3])}<br><span class="mut">${n[5]} · our two-line summary, full story at the source ↗</span></span><span class="mut">${n[1]==='ALL'?'Field':byId(n[1]).name}</span></div>`).join(''),`<div class="th">${cats.map(c=>`<button type="button" class="chip" data-set="wire" data-v="${c}" aria-pressed="${state.wire===c}">${c}</button>`).join('')}</div>`)};
/* ---------- slide-over ---------- */
function over(){const L=$('#layer');if(!state.over){L.innerHTML='';return}const d=byId(state.over);const mate=D.find(x=>x.team===d.team&&x.id!==d.id);
 const hist=(d.form||Array.from({length:16},(_,i)=>d.med+Math.round(Math.sin(i)*12))),n={L5:5,L10:10,SEASON:16}[state.win],h=hist.slice(-n),mx=Math.max(...hist,state.thr+5),hits=h.filter(v=>v>=state.thr).length;
 let body;
 if(state.overTab==='PRESENT')body=`
  <div><span class="lbl">Projection · RD 17</span><div style="display:flex;gap:18px;align-items:flex-end;margin-top:8px"><div class="big num">${d.med}</div><div>${range(d)}<br><span class="mut">floor ${d.floor} · ceiling ${d.ceil}</span></div></div></div>
  ${d.ctor?'':`<div><span class="lbl">Where the points come from</span>${[['Race position',.52],['Positions gained',.2],['Qualifying',.14],['Fastest lap / bonus',.08],['DNF risk',-.06]].map(([l,f])=>`<div class="row" style="grid-template-columns:1fr 90px 40px"><span>${l}</span><span class="meter ${f<0?'r':''}"><i style="width:${Math.abs(f)*150}%"></i></span><span class="num">${f<0?'−':''}${Math.abs(d.med*f).toFixed(1)}</span></div>`).join('')}</div>`}
  <div><div class="th"><span class="lbl">Hit rate · scored ${state.thr}+</span><span class="h2 num ${hits/n>=.65?'pos':hits/n<.45?'red':''}">${hits}/${h.length}</span></div>
   <div class="th" style="margin:8px 0">${tabs('win',['L5','L10','SEASON'])}<span>${[15,25,35,45].map(t=>`<button type="button" class="chip" data-set="thr" data-v="${t}" aria-pressed="${state.thr===t}">${t}+</button>`).join(' ')}</span></div>
   <div class="bars">${h.map((v,i)=>`<span class="${v>=state.thr?'hit':''}" style="height:${v/mx*100}%" data-tip="RD ${17-h.length+i}: ${v} pts"></span>`).join('')}<u style="bottom:${state.thr/mx*100}%"></u></div></div>
  ${mate?`<div><span class="lbl">Head to head · ${mate.name}</span>${[['Quali',11,5],['Race',9,7],['Fantasy pts',10,6]].map(([l,a,b])=>`<div class="row split"><span class="num">${a}</span><span><span class="mut">${l}</span><span class="sb"><i style="flex:${a}"></i><em style="flex:${b}"></em></span></span><span class="num mut" style="text-align:right">${b}</span></div>`).join('')}</div>`:''}`;
 else if(state.overTab==='PAST')body=`
  <div><span class="lbl">Season so far · 16 rounds</span><div class="bars" style="margin-top:10px">${hist.map((v,i)=>`<span class="hit" style="height:${v/mx*100}%" data-tip="RD ${i+1}: ${v} pts"></span>`).join('')}</div></div>
  <div><span class="lbl">Splits · avg points</span>${[['Street circuits',1.12],['High-speed',.96],['High-downforce',.9],['Wet sessions',1.2],['Sprint weekends',1.05]].map(([l,f])=>`<div class="row" style="grid-template-columns:1fr auto auto"><span>${l}</span><span class="num">${(d.med*f).toFixed(1)}</span><span class="num">${arrow(Math.round(d.med*f-d.med))}</span></div>`).join('')}</div>
  <div><span class="lbl">Season profile · percentile vs field</span>${['Qualifying','Starts','Lap one','Race pace','Tyre management','Pit stops','Overtaking'].map((l,i)=>{const v=Math.min(98,Math.round(d.med*1.4+((d.price*7+i*13)%25)));return `<div class="row" style="grid-template-columns:1fr 110px 30px"><span>${l}</span><span class="meter"><i style="width:${v}%"></i></span><span class="num">${v}</span></div>`}).join('')}</div>`;
 else body=`
  <div><span class="lbl">Next rounds · circuit fit</span><div style="display:flex;gap:6px;margin-top:10px;flex-wrap:wrap">${(d.fit||[4,3,4,2,3,5]).map((v,i)=>`<span style="display:grid;gap:4px;justify-items:center">${fitCell(v,ROUNDS[i])}<span class="mut" style="font-size:9px">${ROUNDS[i]}</span></span>`).join('')}</div></div>
  <div><div class="th"><span class="lbl">Outlook</span><span class="pill">Estimate · written by AI</span></div><p class="est">${d.name} goes to Baku as ${d.val>12?'one of the best values on the board':'a premium pick priced near expectation'}. Long straights ${d.fit?.[0]>=4?'suit the car':'expose a straight-line deficit'}, and a ${d.dnf}% retirement risk keeps the floor at ${d.floor}. Expect the price to ${d.dprice>0?'rise if they clear '+Math.round(d.price/11+6)+' points':'hold or dip'}; the next two rounds are ${d.fit?.[1]>=3?'friendly':'harder'}.</p><span class="mut">Built only from: projection model, circuit fit, price model, 2 tagged stories. Generated 19 Sep 06:04 UTC.</span></div>
  <div><span class="lbl">Tagged news</span>${NEWS.filter(n=>n[1]===d.id||n[1]===d.team||n[1]==='ALL').map(n=>`<div class="row" style="grid-template-columns:90px 1fr"><span class="pill ${n[2]==='−'?'r':''}">${n[0]}</span><span>${esc(n[3])}</span></div>`).join('')}</div>`;
 L.innerHTML=`<div class="scrim" data-close></div><aside class="over" role="dialog" aria-label="${d.name} detail"><div class="th"><span class="mut">${d.ctor?'CONSTRUCTOR':'#'+d.num+' · '+TEAMS[d.team][0]}</span><button type="button" class="ghost" data-close>Close ✕</button></div>
  <div><div class="brand"><h1 style="font-size:24px">${d.name}</h1></div><div style="margin-top:6px">${bar(d.team)}<span class="num">${money(d.price)}</span> · next ${arrow(d.dprice||0)} · ${state.lineup.includes(d.id)||state.ctor===d.id?'<span class="red">IN YOUR LINEUP</span>':'<span class="mut">not owned</span>'}</div></div>
  ${tabs('overTab',['PAST','PRESENT','OUTLOOK'],false)}${body}</aside>`}
/* ---------- render + events ---------- */
function render(){$('#nav').innerHTML=PAGES.map(p=>`<button type="button" role="tab" data-go="${p}" aria-selected="${state.page===p}">${p}</button>`).join('');
 $('#main').innerHTML=`<div class="page">${P[state.page]()}</div>`;$('#ctxBank').textContent=money(BUDGET-spent());$('#ctxProj').textContent=proj()+' pts';over();
 requestAnimationFrame(()=>{const s=(document.documentElement.scrollHeight/window.innerHeight);$('#scrollBudget').innerHTML=`Scroll budget · ${s.toFixed(1)} / 3.0 screens ${s<=3?'<span class="pos">✓</span>':'<span class="red">over</span>'}`})}
function toast(t){const e=$('#toast');e.textContent=t;e.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>e.hidden=true,2200)}
document.addEventListener('click',e=>{const t=e.target.closest('[data-go],[data-set],[data-open],[data-close],[data-slot],[data-swap],[data-apply],[data-ace],[data-try],#save,#reset,#themeBtn');if(!t)return;const s=t.dataset;
 if(t.id==='themeBtn'){const r=document.documentElement,cur=r.dataset.theme||(matchMedia('(prefers-color-scheme: light)').matches?'light':'dark');r.dataset.theme=cur==='dark'?'light':'dark';return}
 if(t.id==='save'){state.saved=JSON.stringify([state.lineup,state.ctor,state.ace]);toast('Lineup saved (prototype: nothing was written)')}
 else if(t.id==='reset'){[state.lineup,state.ctor,state.ace]=JSON.parse(state.saved);state.slot=null}
 else if(s.go){state.page=s.go;state.slot=null;window.scrollTo(0,0)}
 else if(s.set){const v=isNaN(+s.v)?s.v:+s.v;state[s.set]=v}
 else if('open' in s){if(!s.open)return;state.over=s.open;state.overTab='PRESENT'}
 else if('close' in s){state.over=null}
 else if(s.slot){state.slot=state.slot===s.slot?null:s.slot}
 else if(s.swap){if(state.slot==='CTOR')state.ctor=s.swap;else{if(state.ace===state.slot)state.ace=s.swap;state.lineup=state.lineup.map(x=>x===state.slot?s.swap:x)}state.slot=null}
 else if(s.apply){const[o,n]=s.apply.split(':');if(state.ace===o)state.ace=n;state.lineup=state.lineup.map(x=>x===o?n:x)}
 else if(s.try){const[o,n]=s.try.split(':');if(o==='CTOR')state.ctor=n;else{if(state.ace===o)state.ace=n;state.lineup=state.lineup.map(x=>x===o?n:x)}state.page='LINEUP LAB';state.rec=0;state.slot=null;window.scrollTo(0,0);toast('Swap applied as a what-if. Save it in the lineup lab.')}
 else if(s.ace){state.ace=s.ace}
 render()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&state.over){state.over=null;render()}if((e.key==='Enter'||e.key===' ')&&e.target.matches('[tabindex]')){e.preventDefault();e.target.click()}});
document.addEventListener('mousemove',e=>{const t=e.target.closest('[data-tip]'),tip=$('#tip');if(!t){tip.hidden=true;return}tip.textContent=t.dataset.tip;tip.hidden=false;tip.style.left=Math.min(e.clientX+12,innerWidth-250)+'px';tip.style.top=(e.clientY+14)+'px'});
addEventListener('resize',render);render();
</script>
